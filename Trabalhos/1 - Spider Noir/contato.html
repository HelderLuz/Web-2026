        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/contato.css">
    </head>
    <body>
        <header>
            <h1>Spider-Noir</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="biografia.html">Biografia</a></li>
                    <li><a href="poderes.html">Poderes e habilidades</a></li>

            <img src="images/spider-noir-char.webp" id="spider-noir-desvia" alt="Spider-noir desviando de algo">
        </header>
        <main>
            <section>
                <h2>Entre em contato com o Spider-Noir</h2>

                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required>

                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" name="assunto" required>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="10" required></textarea>

                    <button type="submit">Enviar</button>
            </section>
            <img class="badge" src="images/SpiderManNoir_08.webp" alt="Badge do Spider-noir">

            <img src="images/spider-noir-lego.png" id="spider-lego" alt="Spider-noir de Lego">
        </main>
        <footer>
